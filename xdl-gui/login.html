<!doctype html>
<html lang="zh-CN" data-type="software" data-radius="soft" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18191b">
<meta name="robots" content="noindex,nofollow">
<title>登录 · XDL 云端工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318191b'/%3E%3Cpath d='M8 8l16 16M24 8L8 24' stroke='%23ff4a1f' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="panel login-card" aria-labelledby="login-title">
    <div class="login-brand">
      <div class="tb-brand">
        <span class="appmark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        <div class="tb-titles">
          <h1 class="tb-title" id="login-title">XDL</h1>
          <span class="tb-sub">X 媒体云端工作台</span>
        </div>
      </div>
      <span class="tag mono" id="login-mode-tag">私有门禁</span>
    </div>

    <div class="login-banner hidden" id="login-notice" role="status"></div>

    <form class="login-form" id="login-form" method="post" action="/api/auth/login" autocomplete="on">
      <div class="field">
        <label for="login-username">管理员用户名</label>
        <input
          id="login-username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
          placeholder="输入用户名"
        >
      </div>

      <div class="field">
        <label for="login-password">登录密码</label>
        <div class="pw-wrap">
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="输入密码"
          >
          <button class="pw-toggle" id="btn-toggle-pw" type="button" aria-label="显示密码" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="switchrow login-remember-row" for="login-remember">
        <span class="switch-copy">
          <strong>在此设备记住登录（30 天）</strong>
          <small>不勾选则在 24 小时后自动失效</small>
        </span>
        <span class="switch">
          <input type="checkbox" id="login-remember" name="remember" checked>
          <i aria-hidden="true"></i>
        </span>
      </label>

      <div class="login-banner is-error hidden" id="login-error" role="alert" aria-live="polite"></div>

      <button class="btn accent wide login-submit" id="btn-login-submit" type="submit">
        <span>登录工作台</span>
      </button>
    </form>

    <div class="login-foot">
      <span class="mono">HttpOnly · SameSite=Lax</span>
      <span>错误 5 次自动锁定 15 分钟</span>
    </div>
  </section>
</main>
<script src="login.js"></script>
</body>
</html>
